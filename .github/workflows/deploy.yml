name: Deploy verified Fitness release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Fitness data contracts]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: fitness-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$SHA&status=success&event=push" --jq '.workflow_runs | length' > matching-runs.txt
          test "$(cat matching-runs.txt)" -gt 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and test release image
        run: |
          docker build --platform linux/amd64 --provenance=false --target cloud -t fitness-cloud .
          docker run --rm --read-only --user 1000:1000 --tmpfs /tmp:rw,size=512m -e HOME=/tmp -e PYTHONPATH=/var/task --entrypoint python -v "$PWD/scripts/container_smoke.py:/verify.py:ro" fitness-cloud /verify.py > container-report.json
      - name: Publish and deploy
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          BATCH_SUBNET: ${{ vars.BATCH_SUBNET }}
          BATCH_SECURITY_GROUP: ${{ vars.BATCH_SECURITY_GROUP }}
          FITNESS_BUCKET: ${{ vars.FITNESS_BUCKET }}
        run: |
          IMAGE="$ECR_REPOSITORY:$(git rev-parse HEAD)-$GITHUB_RUN_NUMBER"
          docker tag fitness-cloud "$IMAGE"
          docker push "$IMAGE"
          python -m pip install -r requirements-cloud-tools.txt
          python scripts/deploy_cloud.py --image "$IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-deployment
          path: |
            container-report.json
            deployment-report.json
