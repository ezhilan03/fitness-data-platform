name: Fitness data contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - run: python -m fitness.demo > demo-report.json
      - run: python -m fitness.incremental_demo > incremental-report.json
      - run: python -m pip install -r requirements-dbt.lock
      - run: python -m fitness.dbt_demo
      - run: python -m fitness.operations_demo
      - run: |
          python -m venv .venv-airflow
          .venv-airflow/bin/python -m pip install -r requirements-airflow.lock
      - run: python scripts/verify_airflow.py
      - run: docker build -t fitness-data .
      - run: docker run --rm fitness-data python -m unittest discover -s tests -v
      - run: docker run --rm fitness-data
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-demo-evidence
          path: |
            demo-report.json
            incremental-report.json
            artifacts/dbt-report.json
            artifacts/operations-report.json
            artifacts/airflow-report.json
            artifacts/local/dbt/**/build.log
            artifacts/local/dbt/erasure/target/manifest.json
            artifacts/local/dbt/erasure/target/catalog.json
