name: Fitness data contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m fitness.demo > demo-report.json
      - run: docker build -t fitness-data .
      - run: docker run --rm fitness-data python -m unittest discover -s tests -v
      - run: docker run --rm fitness-data
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-demo-evidence
          path: demo-report.json
